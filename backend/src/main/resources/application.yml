server:
  port: 8080
  servlet:
    context-path: /

spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/losdb}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

app:
  upload:
    base-dir: ${DOCUMENT_STORAGE_PATH:./data/documents}
  loan:
    max-interest-rate: ${LOAN_MAX_INTEREST_RATE:30}
  mock:
    credit:
      profile: GOOD
      score-range:
        excellent: 750-900
        good: 650-749
        average: 550-649
        poor: 300-549

signzy:
  base-url: ${SIGNZY_BASE_URL:}
  api-key: ${SIGNZY_API_KEY:}
  auth-token: ${SIGNZY_AUTH_TOKEN:}
  client-id: ${SIGNZY_CLIENT_ID:}
  client-secret: ${SIGNZY_CLIENT_SECRET:}

mock:
  kyc:
    mode: ${MOCK_KYC_MODE:SUCCESS}

logging:
  level:
    org.springframework.security: INFO
    com.finedge: DEBUG
