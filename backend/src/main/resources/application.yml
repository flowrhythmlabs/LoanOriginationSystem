server:
  port: 8080
  servlet:
    context-path: /

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finedge}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:org.postgresql.Driver}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  upload:
    base-dir: ${DOCUMENT_STORAGE_PATH:./data/documents}
  auth:
    session-minutes: ${LOS_SESSION_MINUTES:60}
    otp-minutes: ${LOS_OTP_MINUTES:5}
    # Development-only OTP exposure. Set false in production and integrate an SMS OTP provider.
    demo-otp-enabled: ${LOS_DEMO_OTP_ENABLED:false}
  loan:
    max-interest-rate: ${LOAN_MAX_INTEREST_RATE:30}
    # Prototype baseline only; replace with approved, versioned product rate cards before production.
    rates:
      personal: ${LOAN_RATE_PERSONAL:10.5}
      home: ${LOAN_RATE_HOME:10.5}
      car: ${LOAN_RATE_CAR:10.5}
      education: ${LOAN_RATE_EDUCATION:10.5}
      business: ${LOAN_RATE_BUSINESS:10.5}
      lap: ${LOAN_RATE_LAP:10.5}
  mock:
    credit:
      profile: GOOD
      score-range:
        excellent: 750-900
        good: 650-749
        average: 550-649
        poor: 300-549

signzy:
  base-url: ${SIGNZY_BASE_URL:}
  api-key: ${SIGNZY_API_KEY:}
  auth-token: ${SIGNZY_AUTH_TOKEN:}
  client-id: ${SIGNZY_CLIENT_ID:}
  client-secret: ${SIGNZY_CLIENT_SECRET:}

mock:
  kyc:
    mode: ${MOCK_KYC_MODE:SUCCESS}

logging:
  level:
    org.springframework.security: INFO
    com.finedge: DEBUG

providers:
  sms:
    url: ${SMS_API_URL:}
    api-key: ${SMS_API_KEY:5863e613-cc4a-11f1-ac3e-0200cd936042}
    authorization-header: ${SMS_AUTH_HEADER:X-API-Key}
    sender-id: ${SMS_SENDER_ID:}
    template-id: ${SMS_TEMPLATE_ID:}
  bureau:
    url: ${BUREAU_API_URL:}
    api-key: ${BUREAU_API_KEY:}
    authorization-header: ${BUREAU_AUTH_HEADER:X-API-Key}
    score-json-pointer: ${BUREAU_SCORE_JSON_POINTER:/creditScore}
    name: ${BUREAU_NAME:CONFIGURED_BUREAU}
